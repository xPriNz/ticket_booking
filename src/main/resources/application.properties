spring.application.name=booking
spring.profile.active=compose
spring.jpa.hibernate.ddl-auto=update

# --- Error handling ---

# Rzucaj NoHandlerFoundException zamiast serwować Whitelabel Error Page
spring.mvc.throw-exception-if-no-handler-found=true

# Wyłącz automatyczne mapowanie statycznych zasobów — bez tego Spring dla
# nieznanego endpointu próbuje serwować statyczny plik i nie rzuca 404.
spring.web.resources.add-mappings=false

# Włącz include stack trace tylko dla dev (nigdy w produkcji!)
# W produkcji nadpisz w application-prod.properties
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# --- Logging ---

# Dodaj traceId z MDC do formatu logów, żeby móc korelować requesty
logging.pattern.level=%5p [traceId=%X{traceId:-}]
